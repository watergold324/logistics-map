  var chips = varieties.map(function (v) {
      return '<span class="chip' + (DVARIETY === v ? " on" : "") + '" data-v="' + esc(v) + '">' + esc(v) +
        ' <span style="color:#ADB5BD">' + vcnt[v] + '</span></span>';
    }).join("");
  document.getElementById("rt-sub").innerHTML = "到货 " + all.length + " 条 ｜ " + Object.keys(froms).length +
    " 个发货地 ｜ 有价格 " + priced.length + " 条" + '<div style="margin-top:6px">' + chips + "</div>";

  // 柱状图：每个发货地一根『价格区间柱』（最低→最高），黑线=均价
  var byFrom = {};
  rows.forEach(function (r) {
    var f = r.route.split("→")[0].trim();
    (byFrom[f] = byFrom[f] || []).push(r);
  });
  var items = Object.keys(byFrom).map(function (f) {
    var rs = byFrom[f].slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var ps = rs.map(function (r) { return r.price; });
    var lgs = {};
    rs.forEach(function (r) { lgs[r.logistics] = 1; });
    return { f: f, dist: rs[0].dist, dunit: rs[0].dunit, n: rs.length,
             lo: Math.min.apply(null, ps), hi: Math.max.apply(null, ps),
             avg: Math.round(ps.reduce(function (a, b) { return a + b; }, 0) / ps.length),
             lg: rs[0].logistics, date: rs[0].date, lgs: Object.keys(lgs) };
  }).filter(function (x) { return x.dist != null; }).sort(function (a, b) { return a.dist - b.dist; });
  var _c = document.getElementById("chart");
  if (!items.length) { _c.innerHTML = '<div class="empty">没有带距离的数据（端点未上图）</div>'; }
  else {
    var W = 900, H = 430, L = 56, R = 16, T = 18, B = 92;
    var iw = W - L - R, ih = H - T - B;
    var pmin = Math.min.apply(null, items.map(function (x) { return x.lo; }));
    var pmax = Math.max.apply(null, items.map(function (x) { return x.hi; }));
    if (pmax === pmin) pmax = pmin + 5;
    var pad2 = (pmax - pmin) * 0.15; pmin = Math.max(0, pmin - pad2); pmax += pad2;
    function Y(v) { return T + ih - ih * (v - pmin) / (pmax - pmin); }
    var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'];
    for (var g = 0; g <= 4; g++) {
      var yv = pmin + (pmax - pmin) * g / 4, yy = Y(yv);
      s.push('<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '" stroke="#F1F3F5"/>');
      s.push('<text x="' + (L - 8) + '" y="' + (yy + 4).toFixed(1) + '" font-size="11" fill="#868E96" text-anchor="end">' + Math.round(yv) + '</text>');
    }
    var step2 = iw / items.length;
    var bw = Math.max(5, Math.min(44, step2 * 0.6));
    var many = items.length > 16;
    items.forEach(function (it, i) {
      var cx = L + step2 * (i + 0.5);
      var yh = Y(it.hi), yl = Y(it.lo);
      var tip = esc(it.f + "　距离约 " + it.dist + "km　" + it.n + " 趟　最低 " + it.lo + " / 最高 " + it.hi + " 元/吨　" + it.lgs.join("、"));
      s.push('<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + yh.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(2, yl - yh).toFixed(1) + '" rx="2" fill="#4C6EF5" fill-opacity=".85"><title>' + tip + '</title></rect>');
      if (!many) {
        s.push('<text x="' + cx.toFixed(1) + '" y="' + (yh - 4).toFixed(1) + '" font-size="9.5" fill="#868E96" text-anchor="middle">' + it.hi + '</text>');
        s.push('<text x="' + cx.toFixed(1) + '" y="' + (yl + 11).toFixed(1) + '" font-size="9.5" fill="#868E96" text-anchor="middle">' + it.lo + '</text>');
      }
      s.push('<text x="' + cx.toFixed(1) + '" y="' + (H - B + 16) + '" font-size="10" fill="#495057" text-anchor="end" transform="rotate(-32 ' + cx.toFixed(1) + ' ' + (H - B + 16) + ')">' + esc(it.f) + ' ' + it.dist + 'km</text>');
    });
    s.push('<text x="' + (W - R) + '" y="' + (H - 8) + '" font-size="11" fill="#ADB5BD" text-anchor="end">柱=价格区间（最低–最高）　单位 元/吨</text>');
    s.push("</svg>");
    _c.innerHTML = s.join("");
    document.getElementById("legend").innerHTML = "";
  }
  // 汇总表（按发货地）
  var tblEl = document.getElementById("tbl");
  tblEl.className = "dest";
  tblEl.querySelector("thead").innerHTML = "<tr><th>发货地</th><th>距离</th><th>最低价</th><th>最高价</th><th>价格区间</th><th>物流</th></tr>";
  var tb = tblEl.querySelector("tbody");
  tb.innerHTML = Object.keys(byFrom).map(function (f) {
    var rs = byFrom[f].slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var ps = rs.map(function (r) { return r.price; });
    var lgs = {};
    rs.forEach(function (r) { lgs[r.logistics] = 1; });
    var _lo = Math.min.apply(null, ps), _hi = Math.max.apply(null, ps);
    return "<tr><td>" + esc(f) + "</td><td>" + (rs[0].dist ? "约 " + esc(rs[0].dist) + " 公里" + (rs[0].dunit === "实际" ? "" : "（直线）") : "—") +
      "</td><td>" + _lo + "</td><td>" + _hi + "</td><td>" + (_lo === _hi ? _lo : _lo + "–" + _hi) +
      "</td><td>" + Object.keys(lgs).map(function (x) { return '<span style="color:' + colorOf(x) + '">' + esc(x) + "</span>"; }).join("、") + "</td></tr>";
  }).join("");
}

// ---- 曲线绘制 ----
function render(routeKey) {
  var info = ROUTE_MAP[routeKey];
  if (!info) return;
  var priced = info.rows.filter(function (r) { return r.price != null; });
  if (!priced.length) { document.getElementById("tip").textContent = "这条路线还没有价格数据"; return; }
  document.getElementById("tip").style.display = "none";
  document.getElementById("chart-card").style.display = "block";
  document.getElementById("tbl-card").style.display = "block";

  var varieties = {};
  info.rows.forEach(function (r) { varieties[r.variety] = 1; });
  document.getElementById("rt-title").textContent = routeKey;
  var _rd = info.rows[0] || {};
  var distTxt = (_rd.dist ? '约 ' + _rd.dist + ' 公里' + (_rd.dunit === '实际' ? '' : '（直线）') : '');
  document.getElementById("rt-sub").textContent = "品种：" + Object.keys(varieties).join(" / ") +
      "　共 " + info.rows.length + " 条（含价格 " + priced.length + " 条）" + (distTxt ? "　距离 " + distTxt : "");

  // 按物流分组
  var series = {};
  priced.forEach(function (r) {
    if (!series[r.logistics]) series[r.logistics] = [];
    series[r.logistics].push(r);
  });
  var dates = {}; priced.forEach(function (r) { dates[r.date] = 1; });
  var xs = Object.keys(dates).sort();
  var prices = priced.map(function (r) { return r.price; });
  var pmin = Math.min.apply(null, prices), pmax = Math.max.apply(null, prices);
  if (pmax === pmin) { pmax += 5; pmin = Math.max(0, pmin - 5); }
  var pad = (pmax - pmin) * 0.12; pmin = Math.max(0, pmin - pad); pmax = pmax + pad;

  var W = 900, H = 380, L = 56, R = 16, T = 16, B = 54;
  var iw = W - L - R, ih = H - T - B;
  var t0 = Date.parse(xs[0] + "T00:00:00"), t1 = Date.parse(xs[xs.length - 1] + "T00:00:00");
  if (t1 === t0) { t1 = t0 + 864e5; }
  function X(d) { return L + iw * (Date.parse(d + "T00:00:00") - t0) / (t1 - t0); }
  function Y(p) { return T + ih - ih * (p - pmin) / (pmax - pmin); }

  var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'];
  // y 网格
  for (var g = 0; g <= 4; g++) {
    var pv = pmin + (pmax - pmin) * g / 4, y = Y(pv);
    s.push('<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '" stroke="#F1F3F5"/>');
    s.push('<text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" font-size="11" fill="#868E96" text-anchor="end">' + Math.round(pv) + '</text>');
  }
  // x 轴日期
  var step = Math.max(1, Math.ceil(xs.length / 12));
  xs.forEach(function (d, i) {
    if (i % step) return;
    s.push('<text x="' + X(d).toFixed(1) + '" y="' + (H - B + 20) + '" font-size="10.5" fill="#868E96" text-anchor="middle">' + d.slice(5) + '</text>');
  });
  s.push('<text x="' + L + '" y="' + (H - 8) + '" font-size="11" fill="#ADB5BD">单价 元/吨</text>');
  // 节日竖线（橙色虚线）
  var _hm = 0;
  HOLIDAY_MARKS.forEach(function (hm) {
    var tt = Date.parse(hm[0] + "T00:00:00");
    if (tt < t0 || tt > t1) return;
    var hx = L + iw * (tt - t0) / (t1 - t0);
    s.push('<line x1="' + hx.toFixed(1) + '" y1="' + T + '" x2="' + hx.toFixed(1) + '" y2="' + (T + ih) + '" stroke="#E8590C" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>');
    s.push('<text x="' + (hx + 3).toFixed(1) + '" y="' + (T + 11 + (16 * (_hm % 2))) + '" font-size="10" fill="#E8590C">' + esc(hm[1]) + '</text>');
    _hm++;
  });

  var legend = [];
  Object.keys(series).sort().forEach(function (lg) {
    var pts = series[lg].slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var col = colorOf(lg);
    var dash = (lg === "询价") ? ' stroke-dasharray="4 3"' : '';
    if (!HIDDEN[lg]) {
      var d = pts.map(function (r, i) { return (i ? "L" : "M") + X(r.date).toFixed(1) + " " + Y(r.price).toFixed(1); }).join(" ");
      s.push('<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2"' + dash + ' stroke-linejoin="round"/>');
      pts.forEach(function (r) {
        s.push('<circle cx="' + X(r.date).toFixed(1) + '" cy="' + Y(r.price).toFixed(1) + '" r="3.2" fill="#FFF" stroke="' + col + '" stroke-width="2"><title>' +
               esc(lg + "　" + r.date + "　" + r.price + "元/吨" + (r.ton ? "　" + r.ton + r.tunit : "")) + '</title></circle>');
      });
    }
    legend.push({ lg: lg, col: col, n: pts.length });
  });
  s.push("</svg>");
  document.getElementById("chart").innerHTML = s.join("");
  document.getElementById("legend").innerHTML = legend.map(function (x) {
    return '<span class="' + (HIDDEN[x.lg] ? "off" : "") + '" data-lg="' + esc(x.lg) + '"><i style="background:' + x.col + '"></i>' + esc(x.lg) + '（' + x.n + '）</span>';
  }).join("");
  Array.prototype.forEach.call(document.getElementById("legend").children, function (el) {
    el.onclick = function () { var lg = el.getAttribute("data-lg"); HIDDEN[lg] = !HIDDEN[lg]; render(routeKey); };
  });

  // 明细表
  var tblEl2 = document.getElementById("tbl");
  tblEl2.className = "";
  tblEl2.querySelector("thead").innerHTML = "<tr><th>日期</th><th>品种</th><th>单价(元/吨)</th><th>距离</th><th>物流</th></tr>";
  var tb = tblEl2.querySelector("tbody");
  tb.innerHTML = info.rows.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (r) {
    return "<tr><td>" + esc(r.date) + (HOLIDAYS[r.date] ? ' <span class="pill" style="background:#FFF4E6;color:#E8590C">' + esc(HOLIDAYS[r.date]) + "</span>" : "") + "</td><td>" + esc(r.variety) +
      "</td><td>" + (r.price != null ? esc(r.price) : "—") +
      "</td><td>" + (r.dist ? "约 " + esc(r.dist) + " 公里" + (r.dunit === "实际" ? "" : "（直线）") : "—") +
      '</td><td><span style="color:' + colorOf(r.logistics) + '">' + esc(r.logistics) + "</span></td></tr>";
  }).join("");
}

var q = document.getElementById("q");
q.addEventListener("input", function () { showList(this.value); });
q.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    if (MODE === "route") {
      var ks = routesMatching(this.value);
      if (ks.length) { document.getElementById("list").style.display = "none"; render(ks[0]); }
    } else {
      var ds = destsMatching(this.value);
      if (ds.length) { document.getElementById("list").style.display = "none"; renderDest(ds[0]); }
    }
  }
});
document.getElementById("tb-route").onclick = function () { setMode("route"); };
document.getElementById("tb-dest").onclick = function () { setMode("dest"); };
var chipsWrap = document.getElementById("rt-sub");
chipsWrap.addEventListener("click", function (e) {
  if (e.target && e.target.className.indexOf("chip") >= 0 && MODE === "dest") {
    DVARIETY = e.target.getAttribute("data-v") || "";
    renderDest(document.getElementById("rt-title").textContent.replace(/^收货地：/, ""));
  }
});
document.addEventListener("click", function (e) { if (e.target.id !== "q") document.getElementById("list").style.display = "none"; });
</script>
</body>
