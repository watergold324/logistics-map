var gesture = null;
function touchDist() {
  var ids = Object.keys(touches);
  var a = touches[ids[0]], b = touches[ids[1]];
  return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
}
function touchMid() {
  var ids = Object.keys(touches);
  var a = touches[ids[0]], b = touches[ids[1]];
  return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
}
svg.addEventListener('touchstart', function(e) {
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    touches[t.identifier] = {x:t.clientX, y:t.clientY};
  }
  var ids = Object.keys(touches);
  if (ids.length === 1) {
    var t0 = touches[ids[0]];
    gesture = {kind:'pan', sx:t0.x, sy:t0.y, x:vb.x, y:vb.y, moved:false};
    svg.classList.add('dragging');
  } else if (ids.length === 2) {
    svg.classList.remove('dragging');
    gesture = {kind:'pinch', d0:touchDist(), m0:touchMid(), x0:vb.x, y0:vb.y, w0:vb.w, h0:vb.h};
  }
}, {passive:false});
svg.addEventListener('touchmove', function(e) {
  if (!gesture) return;
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    if (touches[t.identifier]) { touches[t.identifier].x = t.clientX; touches[t.identifier].y = t.clientY; }
  }
  var rect = svg.getBoundingClientRect();
  var ids = Object.keys(touches);
  if (gesture.kind === 'pan' && ids.length === 1) {
    var c = touches[ids[0]];
    var dxp = c.x - gesture.sx, dyp = c.y - gesture.sy;
    if (dxp*dxp + dyp*dyp > 16) gesture.moved = true;
    vb.x = gesture.x - dxp / rect.width * vb.w;
    vb.y = gesture.y - dyp / rect.height * vb.h;
    applyVB();
  } else if (gesture.kind === 'pinch' && ids.length === 2) {
    var d = touchDist();
    if (d < 5) return;
    var f = d / gesture.d0;
    var nw = Math.min(Math.max(gesture.w0 / f, MINW), VB_W0);
    var nh = nw * gesture.h0 / gesture.w0;
    var pm = {x: (gesture.m0.x - rect.left) / rect.width * gesture.w0 + gesture.x0,
              y: (gesture.m0.y - rect.top) / rect.height * gesture.h0 + gesture.y0};
    var mid = touchMid();
    vb.x = pm.x - (mid.x - rect.left) / rect.width * nw;
    vb.y = pm.y - (mid.y - rect.top) / rect.height * nh;
    vb.w = nw; vb.h = nh;
    applyVB();
  }
}, {passive:false});
function endTouch(e) {
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    delete touches[t.identifier];
  }
  var ids = Object.keys(touches);
  if (ids.length === 1) {
    var r = touches[ids[0]];
    gesture = {kind:'pan', sx:r.x, sy:r.y, x:vb.x, y:vb.y, moved:gesture ? gesture.moved : false};
  } else if (ids.length === 0) {
    if (gesture && gesture.kind === 'pan' && gesture.moved) {
      suppressClick = true;
      setTimeout(function() { suppressClick = false; }, 50);
    }
    gesture = null;
    svg.classList.remove('dragging');
  }
}
svg.addEventListener('touchend', endTouch);
svg.addEventListener('touchcancel', endTouch);

function distToSeg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  var qx = x1 + t * dx, qy = y1 + t * dy;
  var ex = px - qx, ey = py - qy;
  return Math.sqrt(ex * ex + ey * ey);
}
function selectLine(i) {

  svg.appendChild(real);
  real.style.opacity = '1';

}

svg.addEventListener('click', function(e) {
  if (suppressClick) return;  // 拖拽刚结束的 click 不处理，保留选定
  var t = e.target;
  if (t.tagName === 'line') {
    var li = +t.getAttribute('data-i');
    // 几何检测：点击点附近可能有多条重叠/贴近的线（上层线会盖住下层）
    var p = svgPt(e);
    var cands = [];
    allLines.forEach(function(l, idx) {
      if (distToSeg(p.x, p.y, +l.getAttribute('x1'), +l.getAttribute('y1'),
                    +l.getAttribute('x2'), +l.getAttribute('y2')) <= 10) cands.push(idx);
    });
    if (LINE_PICKER && cands.length > 1) {
      openLinePicker(cands);
      return;
    }
    selectLine(li);
    return;
  }
  if (t.closest('.pt')) {
    var g = t.closest('.pt');
    openCityPicker(g);
    return;
  }
  pinned = null;
  clearHighlight();
  info.style.display = 'none';
  citypick.style.display = 'none';
  backdrop.style.display = 'none';
});

var citypick = document.getElementById('citypick');
var citypickTitle = document.getElementById('citypick-title');
var citypickList = document.getElementById('citypick-list');

function cityOf(name) {
  return PLACE_CITY[name] || name;
}

// 把城市点 marker 切换为指定角色图形（origin红三角/dest蓝圆/mixed紫菱）
function setCityMarker(g, role) {
  var mk = g.querySelector('.marker');
  if (!mk) return;
  var x = parseFloat(mk.getAttribute('cx'));
  var y = parseFloat(mk.getAttribute('cy'));
  if (!isFinite(x)) {
    var pp = mk.getAttribute('points').split(' ').map(function(p) { return p.split(',').map(parseFloat); });
    x = pp.reduce(function(s, p){return s+p[0]}, 0) / pp.length;
    y = pp.reduce(function(s, p){return s+p[1]}, 0) / pp.length;
  }
  function _mkDiamond(fill, sw) {
    var d = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    d.setAttribute('points', x + ',' + (y-2.2) + ' ' + (x+2.2) + ',' + y + ' ' + x + ',' + (y+2.2) + ' ' + (x-2.2) + ',' + y);
    d.setAttribute('fill', fill);
    d.setAttribute('stroke-width', sw);
    return d;
  }
  function _mkTri() {
    var t = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    t.setAttribute('points', x + ',' + (y-2.5) + ' ' + (x-1.8) + ',' + (y+1.5) + ' ' + (x+1.8) + ',' + (y+1.5));
    t.setAttribute('fill', '#E03131');
    t.setAttribute('stroke-width', '0.4');
    return t;
  }
  function _mkCircle() {
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', '2.2');
    c.setAttribute('fill', '#1971C2');
    c.setAttribute('stroke-width', '0.4');
    return c;
  }
  var nmk;
  if (role === 'origin') nmk = _mkTri();
  else if (role === 'dest') nmk = _mkCircle();
  else if (role === 'multi-origin') nmk = _mkDiamond('#E03131', '0.5');
  else if (role === 'multi-dest') nmk = _mkDiamond('#1971C2', '0.5');
  else nmk = _mkDiamond('#9C36B5', '0.5');
  nmk.setAttribute('class', 'marker');
  nmk.setAttribute('stroke', 'white');
  mk.parentNode.replaceChild(nmk, mk);
}

function openCityPicker(g) {
  var names = g.getAttribute('data-names').split('、');
  var city = cityOf(names[0]);
  citypickTitle.textContent = '📍 ' + city + '（' + names.length + ' 家公司）';
  citypickList.innerHTML = '';
  // 先按角色分组：发货地在前，收货地在后（同一角色内按次数降序）
  var listItems = names.map(function(n) {
    var isOrigin = !!(CO_CNT[n] && CO_CNT[n].out);
    var cnt = isOrigin ? (CO_CNT[n] ? CO_CNT[n].out : 0) : (CO_CNT[n] ? CO_CNT[n].in : 0);
    return { name: n, isOrigin: isOrigin, cnt: cnt };
  });
  listItems.sort(function(a, b) {
    if (a.isOrigin !== b.isOrigin) return a.isOrigin ? -1 : 1;
    return b.cnt - a.cnt;
  });
  var lastIsOrigin = null;
  listItems.forEach(function(it) {
    if (lastIsOrigin !== it.isOrigin) {
      var sep = document.createElement('div');
      sep.className = 'cp-sep';
      sep.textContent = it.isOrigin ? '▲ 发货地' : '▼ 收货地';
      citypickList.appendChild(sep);
      lastIsOrigin = it.isOrigin;
    }
    var item = document.createElement('div');
    item.className = 'cp-item ' + (it.isOrigin ? 'cp-origin' : 'cp-dest');
    var badge = it.isOrigin ? '发' : '收';
    var role = it.isOrigin ? '发货 ' + it.cnt + ' 次' : '收货 ' + it.cnt + ' 次';
    item.innerHTML = '<span class="cp-badge ' + (it.isOrigin ? 'cp-b-origin' : 'cp-b-dest') + '">' + badge + '</span>' +
      '<span>' + it.name + '</span>' +
      '<span class="cp-role">（' + role + '）</span>';
    item.addEventListener('click', function() {
      highlightCompany(it.name);
      citypick.style.display = 'none';
      backdrop.style.display = 'none';
    });
    // 记录该公司角色（发货/收货），用于点击后切换图形
    item.setAttribute('data-role', it.isOrigin ? 'origin' : 'dest');
    citypickList.appendChild(item);
  });
  backdrop.style.display = 'block';
  citypick.style.display = 'block';
}

// 按公司名高亮：该公司的所有线路（作为发货地或收货地）+ 对端城市点
function highlightCompany(name) {
  pinned = [name];
  // others[城市] = 与选中公司直接相连的对端公司名数组
  var others = {};
  allLines.forEach(function(l) {
    var r = ROUTES[+l.getAttribute('data-i')];
    var ends = routeEnds(r.route);
    if (ends[0] === name || ends[1] === name) {
      l.style.strokeWidth = '1.3';
      l.style.opacity = '1';
      var other = ends[0] === name ? ends[1] : ends[0];
      if (other) {
        var c = cityOf(other);
        (others[c] = others[c] || []).push(other);
      }
    } else {
      l.style.opacity = '0.05';
    }
  });
  var selfRole = (CO_CNT[name] && CO_CNT[name].out) ? 'origin' : 'dest';
  var otherRole = selfRole === 'origin' ? 'dest' : 'origin';
  allPts.forEach(function(g) {
    var ns = g.getAttribute('data-names').split('、');
    var isSelf = ns.indexOf(name) >= 0;
    // 该城市点里与选中公司相连的公司名（去重）
    var rel = [];
    ns.forEach(function(n) {
      var c = cityOf(n);
      (others[c] || []).forEach(function(o) { if (rel.indexOf(o) < 0) rel.push(o); });
    });
    var hit = isSelf || rel.length > 0;
    var lb = g.querySelector('.plabel');
    if (isSelf) {
      // 选中公司：切换为该公司的发货/收货图形，标签显示公司名，数字=该公司线路数
      g.style.opacity = '1';
      setCityMarker(g, selfRole);
      g.setAttribute('data-picked', name);
      var cntEl2 = g.querySelector('.cnt');
      if (cntEl2) {
        cntEl2.textContent = lineCount(name, selfRole === 'origin');
      }
      if (lb) { lb.textContent = g.getAttribute('data-city') || name; }
    } else if (hit) {
      g.style.opacity = '1';
      // 对端城市点：按场景角色切换图形（选中发货->对端变蓝圆；选中收货->对端变红三角），不加橙色描边
      setCityMarker(g, otherRole);
      g.setAttribute('data-picked', '1');
      if (lb) { lb.textContent = g.getAttribute('data-city') || ''; lb.style.display = 'block'; }
      // 对端数字 = 选中公司与对端公司之间的实际发货次数
      var cntEl3 = g.querySelector('.cnt');
      if (cntEl3) cntEl3.textContent = countBetween(name, rel);
    } else {
      g.style.opacity = '0.06';
      if (lb) lb.style.display = 'none';
    }
  });
  showCompanyInfo(name);
  reorderZ();
}

// 公司详情：该公司的全部路线
function groupRows(list, useFull) {
  var groups = {};
  list.forEach(function(r) { (groups[r.route] = groups[r.route] || []).push(r); });
  var h = '';
  Object.keys(groups).forEach(function(rt) {
    var arr = groups[rt], r0 = arr[0];
    var sub = '';
    arr.forEach(function(r) {
      var idx = useFull ? FULL_ROUTES.indexOf(r) : ROUTES.indexOf(r);
      sub += '<tr class="rg-sub rt-click" style="display:none" onclick="' + (useFull ? 'rowClickF(' + idx + ')' : 'rowClick(' + idx + ')') + '"><td class="k">' + r.date + '</td><td>' + r.variety +
        (r.ton ? '　' + r.ton + (r.tunit === '车' ? '车' : '吨') : '') +
        (r.price ? '　' + r.price + '元/吨' : '') +
        (r.dist ? '　约' + r.dist + (r.dunit === '实际' ? '公里' : '公里(直线)') : '') + '</td></tr>';
    });
    var txt = rt + '　' + arr.length + ' 趟' + (r0.dist ? '　约' + r0.dist + (r0.dunit === '实际' ? '公里' : '公里(直线)') : '');
    h += '<tr class="rg-head"><td class="k" colspan="2" data-txt="' + txt + '" onclick="toggleGroup(this)"><span class="rg-ic">▸</span> ' + txt + '</td></tr>' + sub;
  });
  return h;
}
function toggleGroup(td) {
  var tr = td.parentNode;
  var on = tr.classList.toggle('rg-open');
  var ic = td.querySelector('.rg-ic');
  if (ic) ic.textContent = on ? '▾' : '▸';
  var n = tr.nextElementSibling;
  while (n && n.classList.contains('rg-sub')) { n.style.display = on ? '' : 'none'; n = n.nextElementSibling; }
}

function showCompanyInfo(name) {
  var list = FULL_ROUTES.filter(function(r) {
    return r.route.startsWith(name + ' →') || r.route.endsWith('→ ' + name);
  });
  var html = '<h4>' + name + '（' + (PLACE_CITY[name] || '未上图') + '）</h4><table>';
  html += '<tr><td class="k">发货</td><td>' + list.filter(function(r){return r.route.startsWith(name+' →')}).length + ' 次</td></tr>';
  html += '<tr><td class="k">收货</td><td>' + list.filter(function(r){return r.route.endsWith('→ '+name)}).length + ' 次</td></tr>';
  html += groupRows(list, true);
  html += '</table>';
  info.innerHTML = html;
  info.style.display = 'block';
}

// 高亮描边色：收货地(蓝圆/蓝菱)保持蓝色系，发货地/混合用橙色
function markerStroke(g) {
  var mk = g.querySelector('.marker');
  if (!mk) return '#E8590C';
  // 按当前图形颜色判断角色：蓝（#1971C2 圆/菱 = 收货）→ 蓝描边；红/紫（发货/混合）→ 橙描边
  return (mk.getAttribute('fill') || '') === '#1971C2' ? '#1C7ED6' : '#E8590C';
}

// 悬浮发货地亮起时：对端混合紫菱按收货公司数量切换为蓝圆(1家)/蓝菱(多家)
function swapDestMarker(g) {
  if (!g.classList.contains('citypt')) return;
  var baseRole = g.getAttribute('data-base-role') || '';
  if (baseRole !== 'mixed') return;
  var ns = g.getAttribute('data-names').split('、');
  var destCnt = ns.filter(function(n) { return CO_CNT[n] && CO_CNT[n].in; }).length;
  setCityMarker(g, destCnt > 1 ? 'multi-dest' : 'dest');
  g.setAttribute('data-swapped', '1');
}

// 悬浮城市点：亮起该市所有公司相关的线路 + 对端城市
function highlightCity(namesArr) {
  var hk = namesArr.join('、');
  if (hk === _lastCityKey) return;
  _lastCityKey = hk;
  var nameSet = {};
  namesArr.forEach(function(n) { nameSet[n] = 1; });
  var srcIsOrigin = namesArr.some(function(n) { return CO_CNT[n] && CO_CNT[n].out; });
  var others = {};
  allLines.forEach(function(l) {
    var r = ROUTES[+l.getAttribute('data-i')];
    var ends = routeEnds(r.route);
    if (nameSet[ends[0]] || nameSet[ends[1]]) {
      l.style.strokeWidth = '1.3';

function zoomToPts(gs) {

      y = pp.reduce(function(s, p){ return s + p[1]; }, 0) / pp.length;
    }
    xs.push(x); ys.push(y);
  });
  if (!xs.length) return;

// ---- 线路搜索 ----
// 提取日期条件（9.2 / 09-02 / 9月2日 / 0902 / 20260902）→ [月,日]
function parseDateTerms(q) {
  var terms = [];
  var m;
  var re1 = /(\d{1,2})[.\/-](\d{1,2})/g;
  while ((m = re1.exec(q)) !== null) {
    var mm = +m[1], dd = +m[2];
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) terms.push([mm, dd]);
  }
  var re2 = /(\d{1,2})月(\d{1,2})日?/g;
  while ((m = re2.exec(q)) !== null) {
    var mm2 = +m[1], dd2 = +m[2];
    if (mm2 >= 1 && mm2 <= 12 && dd2 >= 1 && dd2 <= 31) terms.push([mm2, dd2]);
  }
  var m3 = q.match(/(?:20\d{2})?(\d{2})(\d{2})/);
  if (m3 && +m3[1] >= 1 && +m3[1] <= 12 && +m3[2] >= 1 && +m3[2] <= 31) {
    terms.push([+m3[1], +m3[2]]);
  }
  return terms;
}
function dateMatch(dateStr, terms) {
  if (!terms.length) return true;
  var mm = +dateStr.slice(5, 7), dd = +dateStr.slice(8, 10);
  return terms.some(function(t) { return t[0] === mm && t[1] === dd; });
}
// 提取品种关键词（中文片段中能命中某个品种名的部分；"一车"的"一"也排除，避免误匹配"一级豆油"）
function varietyTerms(q) {
  var zh = q.replace(/[\d\s.\/-年月日车一]/g, ' ').split(/\s+/).filter(function(s) { return s; });
  return zh.filter(function(s) {
    return ROUTES.some(function(r) { return r.variety && r.variety.indexOf(s) >= 0; });
  });
}
// 线路搜索：日期/品种/一车(33-35t) 条件全满足
function searchRoutes(q) {
  var dates = parseDateTerms(q);
  var vterms = varietyTerms(q);
  var tonOne = /(一|1)车/.test(q);
  if (!dates.length && !vterms.length && !tonOne) return [];
  return FULL_ROUTES.filter(function(r) {
    if (!dateMatch(r.date, dates)) return false;
    if (vterms.length && !vterms.some(function(v) { return r.variety && r.variety.indexOf(v) >= 0; })) return false;
    if (tonOne && !(r.ton && r.ton >= 33 && r.ton <= 35)) return false;
    return true;
  });
}
function shortDate(d) {
  return (+d.slice(5, 7)) + '.' + (+d.slice(8, 10));
}

  });
  var html = '<h4>🚛 ' + r0.variety + '（' + shortDate(r0.date) + '）</h4><table>';
  html += '<tr><td class="k">路线</td><td>' + r0.route + '</td></tr>';
  html += '<tr><td class="k">物流</td><td>' + (r0.logistics || '—') + '</td></tr>';
  html += '<tr><td class="k">吨位</td><td>' + (r0.ton || '—') + (r0.tunit === '车' ? ' 车' : ' 吨') + (r0.dist ? '</td></tr><tr><td class="k">距离</td><td>约 ' + r0.dist + (r0.dunit === '实际' ? ' 公里' : ' 公里（直线）') + '</td></tr>' : '</td></tr>');
  html += '<tr><td class="k">运费</td><td>' + (r0.price || '—') + ' 元/吨</td></tr>';
  html += '<tr><td class="k">总运费</td><td>' + (r0.total || '—') + ' 元</td></tr></table>';
  info.innerHTML = html;
  info.style.display = 'block';
  // 跳转定位到线路两端
  var ends2 = routeEnds(routeStr);
  var pts = allPts.filter(function(g) {
    return g.getAttribute('data-names').split('、').some(function(n) { return n === ends2[0] || n === ends2[1]; });
  });
  zoomToPts(pts);
  reorderZ();
}

sq.addEventListener('blur', function() {
  setTimeout(function() { sresults.style.display = 'none'; }, 200);
});

// 提示
var tipTimer = null;
svg.addEventListener('mousemove', function(e) {
  var t = e.target;
  var line = t.tagName === 'line' ? t : null;
  var pt = t.closest ? t.closest('.pt') : null;
  if (line) {
    if (!pinned) clearHighlight();
    var i = +line.getAttribute('data-i');
    var r = ROUTES[i];
    tip.textContent = r.date + ' ｜ ' + r.variety + ' ｜ ' + r.route;
    tip.style.display = 'block';
    clearTimeout(tipTimer);
  } else if (pt) {
    var names = pt.getAttribute('data-names').split('、');
    if (!pinned) highlightCity(names);
    var city = cityOf(names[0]);
    var vs = [];
    names.forEach(function(n) {
      var v = PLACE_VARS[n];
      if (v) (v.out.concat(v.in)).forEach(function(x) { if (vs.indexOf(x) < 0) vs.push(x); });
    });
    tip.textContent = '📍 ' + city + '：' + names.join('、') +
      (vs.length ? ' ｜ 品种：' + vs.join('、') : '');
    tip.style.display = 'block';
    clearTimeout(tipTimer);
  } else {
    if (!pinned) clearHighlight();
    tipTimer = setTimeout(function() { tip.style.display = 'none'; }, 150);
  }
});
</script>
